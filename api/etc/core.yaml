Name: core.api
Host: 0.0.0.0
Port: 8889

# 认证配置
Auth:
  AccessSecret: "2Av^fwbPzdcJyt&&EjFmZVk5BmZDbTVo"
  AccessExpire: 360000

I18nConf:
  Dir: ""

# 项目配置
ProjectConf:
  OpenRegister: true # 是否开启注册
  OpenInit: true # 是否开启初始化
  RegisterRoleValue: "super" # 注册用户默认角色

# 验证码配置
CaptchaConf:
  # 验证码类型: digit(数字), string(字符串), math(数学), chinese(中文), audio(音频), random(随机)
  Type: random

  # 数字验证码配置
  Digit:
    Height: 80
    Width: 240
    Length: 5
    MaxSkew: 0.7
    DotCount: 80

  # 字符串验证码配置
  String:
    Height: 60
    Width: 240
    NoiseCount: 0
    ShowLineOptions: 0
    Length: 4
    Source: "1234567890qwertyuioplkjhgfdsazxcvbnm"
    BgColor:
      R: 254
      G: 254
      B: 254
      A: 254
    Fonts:
      - "wqy-microhei.ttc"
      - "3Dumb.ttf"
      - "ApothecaryFont.ttf"
      - "Comismsh.ttf"
      - "DENNEthree-dee.ttf"
      - "DeborahFancyDress.ttf"
      - "Flim-Flam.ttf"
      - "RitaSmith.ttf"
      - "actionj.ttf"
      - "chromohv.ttf"

  # 数学验证码配置
  Math:
    Height: 60
    Width: 240
    NoiseCount: 0
    ShowLineOptions: 0
    BgColor:
      R: 254
      G: 254
      B: 254
      A: 254
    Fonts:
      - "wqy-microhei.ttc"
      - "3Dumb.ttf"
      - "ApothecaryFont.ttf"
      - "Comismsh.ttf"
      - "DENNEthree-dee.ttf"
      - "DeborahFancyDress.ttf"
      - "Flim-Flam.ttf"
      - "RitaSmith.ttf"
      - "actionj.ttf"
      - "chromohv.ttf"

  # 中文验证码配置
  Chinese:
    Height: 60
    Width: 240
    NoiseCount: 0
    ShowLineOptions: 0
    Length: 2
    Source: "设想你在处理消费者的音频输出音频可能无论什么都没有任何输出或者它可能是单声道立体声或是环绕立体声的假设我们需要不同类型的音频输出来处理不同的情况"
    BgColor:
      R: 254
      G: 254
      B: 254
      A: 254
    Fonts:
      - "wqy-microhei.ttc"

  # 音频验证码配置
  Audio:
    Length: 4
    Language: "zh"

  # 随机验证码配置
  Random:
    # 启用的验证码类型
    EnabledTypes:
      - "digit"
      - "string"
      - "math"
      - "chinese"
    # 是否排除音频验证码
    ExcludeAudio: true

  # 存储配置
  Store:
    # 存储类型: memory(内存), redis(Redis)
    Type: redis
    # 过期时间 (分钟)
    Expire: "5m"
    # Key前缀
    KeyPrefix: "captcha:"
    # Redis配置
    Redis:
      Addr: "127.0.0.1:16379"
      Password: "redis123"
      DB: 0
      PoolSize: 10

# Redis配置
RedisConf:
  Host: "127.0.0.1:16379"
  Password: "redis123"
  DB: 0
  PoolSize: 10

# Rpc 服务
CoreRpc:
  Target: "127.0.0.1:8080"

# Casbin配置
CasbinConf:
  ModelText: |
    [request_definition]
    # r = sub, dom, obj, act
    # r.sub: 主体 (用户)
    # r.dom: 域 (在这里就是您的"资源类型"，如 'api', 'configuration')
    # r.obj: 客体 (资源路径)
    # r.act: 动作 (HTTP方法 或 'read'/'write'/'view')
    r = sub, dom, obj, act

    [policy_definition]
    # p = sub, dom, obj, act
    # p.sub: 主体 (角色)
    # p.dom: 域 (资源类型)
    # p.obj: 客体 (资源路径)
    # p.act: 动作
    p = sub, dom, obj, act

    [role_definition]
    # g = _, _
    # 我们保持角色是全局的，不分域
    g = _, _

    [policy_effect]
    e = some(where (p.eft == allow))

    [matchers]
    # 使用自定义 permissionMatch 函数处理权限继承
    # 1. 检查用户(r.sub)是否属于角色(p.sub)
    # 2. 检查请求的域(r.dom)是否与策略的域(p.dom)完全匹配
    # 3. 检查资源路径(r.obj)是否匹配 (继续使用 keyMatch2)
    # 4. 检查动作(r.act)是否匹配，支持权限继承
    # permissionMatch 函数处理权限继承规则：
    #   - write 权限包含 read 权限（用于 configuration 域）
    #   - admin 权限包含所有权限
    m = g(r.sub, p.sub) && r.dom == p.dom && keyMatch2(r.obj, p.obj) && permissionMatch(p.act, r.act)

# Casbin数据库配置
CasbinDatabaseConf:
  Host: "127.0.0.1"
  Port: 5432
  Username: "postgres"
  Password: "postgres"
  DatabaseName: "last_admin"
  SSLMode: "disable"
  DBType: "postgres"
  MaxOpenConns: 100
  MaxIdleConns: 10
  CacheTime: 300
  DBPath: ""
