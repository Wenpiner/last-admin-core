Name: core.rpc
ListenOn: 0.0.0.0:${SERVER_PORT}

DatabaseConf:
  Host: ${DB_HOST}
  Port: ${DB_PORT}
  Username: ${DB_USER}
  Password: "${DB_PASSWORD}"
  DatabaseName: ${DB_NAME}
  SSLMode: ${DB_SSL_MODE}
  DBType: ${DB_TYPE}
  MaxOpenConns: 100
  MaxIdleConns: 10
  CacheTime: 300
  DBPath: ${DB_PATH}

OAuthStateSecret: ${OAUTH_STATE_SECRET}

CasbinConf:
  ModelText: |
    [request_definition]
    # r = sub, dom, obj, act
    # r.sub: 主体 (用户)
    # r.dom: 域 (在这里就是您的“资源类型”，如 'api', 'configuration')
    # r.obj: 客体 (资源路径)
    # r.act: 动作 (HTTP方法 或 'read'/'write'/'view')
    r = sub, dom, obj, act

    [policy_definition]
    # p = sub, dom, obj, act
    # p.sub: 主体 (角色)
    # p.dom: 域 (资源类型)
    # p.obj: 客体 (资源路径)
    # p.act: 动作
    p = sub, dom, obj, act

    [role_definition]
    # g = _, _
    # 我们保持角色是全局的，不分域
    g = _, _

    [policy_effect]
    e = some(where (p.eft == allow))

    [matchers]
    # 使用自定义 permissionMatch 函数处理权限继承
    # 1. 检查用户(r.sub)是否属于角色(p.sub)
    # 2. 检查请求的域(r.dom)是否与策略的域(p.dom)完全匹配
    # 3. 检查资源路径(r.obj)是否匹配 (继续使用 keyMatch2)
    # 4. 检查动作(r.act)是否匹配，支持权限继承
    # permissionMatch 函数处理权限继承规则：
    #   - write 权限包含 read 权限（用于 configuration 域）
    #   - admin 权限包含所有权限
    m = g(r.sub, p.sub) && r.dom == p.dom && keyMatch2(r.obj, p.obj) && permissionMatch(p.act, r.act)

# Redis配置
RedisConf:
  Host: ${REDIS_HOST}
  Password: ${REDIS_PASSWORD}
  DB: ${REDIS_DB}
  PoolSize: ${REDIS_POOL_SIZE}
